apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devopstia/s12-s11-argocd.git
    targetRevision: main
    path: charts/nginx
    helm:
      releaseName: nginx-prd
      valueFiles:
        - values-prd.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
