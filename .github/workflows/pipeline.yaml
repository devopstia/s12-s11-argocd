name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'notes/**'
      - 'docs/**'
      - '**/*.png'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'notes/**'
      - 'docs/**'
      - '**/*.png'

  workflow_dispatch:

jobs:

  # ============================================================
  # 1. CHECKOUT SOURCE CODE
  # ============================================================
  checkout:
    name: 01 - Checkout Repository
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show working directory
        run: |
          echo "Current working directory:"
          pwd

      - name: List repository contents
        run: |
          echo "Repository successfully checked out."
          echo "Listing repository contents:"
          ls -la

      - name: Show repository structure
        run: |
          echo "Repository structure:"
          find . -maxdepth 2 -type f | sort


  # ============================================================
  # 2. DOCKER & DOCKER COMPOSE SETUP AND VALIDATION
  # ============================================================
  docker-setup:
    name: 02 - Docker & Docker Compose Setup
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      # --------------------------------------------------------
      # Check Docker
      # --------------------------------------------------------
      - name: Check Docker
        run: |
          echo "Checking Docker installation..."

          if command -v docker >/dev/null 2>&1; then
            echo "Docker is already installed."
            docker --version
          else
            echo "Docker is NOT installed."
            echo "Installing Docker..."

            sudo apt-get update
            sudo apt-get install -y docker.io

            echo "Docker installation completed."
            docker --version
          fi


      # --------------------------------------------------------
      # Check Docker Compose
      # --------------------------------------------------------
      - name: Check Docker Compose
        run: |
          echo "Checking Docker Compose installation..."

          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose is already installed."
            docker compose version
          else
            echo "Docker Compose is NOT installed."
            echo "Installing Docker Compose..."

            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin

            echo "Docker Compose installation completed."
            docker compose version
          fi


      # --------------------------------------------------------
      # Verify Docker
      # --------------------------------------------------------
      - name: Verify Docker
        run: |
          echo "Docker Version:"
          docker --version

          echo ""
          echo "Docker Engine Information:"
          docker info


      # --------------------------------------------------------
      # Verify Docker Compose
      # --------------------------------------------------------
      - name: Verify Docker Compose
        run: |
          echo "Docker Compose Version:"
          docker compose version


      # --------------------------------------------------------
      # Pull Public Image
      # --------------------------------------------------------
      - name: Pull Test Docker Image
        run: |
          echo "Pulling hello-world image from Docker Hub..."

          docker pull hello-world:latest

          echo "Image pulled successfully."


      # --------------------------------------------------------
      # List Docker Images
      # --------------------------------------------------------
      - name: List Docker Images
        run: |
          echo "Docker images currently available:"
          docker images


      # --------------------------------------------------------
      # Run Test Container
      # --------------------------------------------------------
      - name: Test Docker
        run: |
          echo "Running hello-world container..."

          docker run --rm hello-world

          echo "Docker test completed successfully."


      # --------------------------------------------------------
      # Final Docker Environment Validation
      # --------------------------------------------------------
      - name: Docker Environment Summary
        run: |
          echo "========================================"
          echo "Docker Environment Summary"
          echo "========================================"

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version

          echo ""
          echo "Available Docker Images:"
          docker images

          echo ""
          echo "Docker and Docker Compose are ready."


  # ============================================================
  # 3. BUILD APPLICATION IMAGES
  # ============================================================
  build-images:
    name: 03 - Build and Push Application Images
    runs-on: ubuntu-latest
    needs: docker-setup
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 788210522308.dkr.ecr.us-east-1.amazonaws.com

    steps:

      # Each job runs on a new runner, so the source must be checked out again.
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --tag k8s-learning-backend:${{ github.sha }} \
            ./k8s-learning-app/backend

      - name: Build frontend image
        run: |
          docker build \
            --tag k8s-learning-frontend:${{ github.sha }} \
            ./k8s-learning-app/frontend

      - name: List built application images
        run: |
          docker image ls \
            --filter "reference=k8s-learning-*:${{ github.sha }}"

      # Pull requests build the images but do not receive AWS credentials or push.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '788210522308'

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            k8s-learning-backend:${{ github.sha }} \
            $ECR_REGISTRY/backend:${{ github.sha }}
          docker tag \
            k8s-learning-backend:${{ github.sha }} \
            $ECR_REGISTRY/backend:latest
          docker tag \
            k8s-learning-frontend:${{ github.sha }} \
            $ECR_REGISTRY/frontend:${{ github.sha }}
          docker tag \
            k8s-learning-frontend:${{ github.sha }} \
            $ECR_REGISTRY/frontend:latest

      - name: Push images to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push $ECR_REGISTRY/backend:${{ github.sha }}
          docker push $ECR_REGISTRY/backend:latest
          docker push $ECR_REGISTRY/frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/frontend:latest

      - name: List pushed application images
        if: github.event_name != 'pull_request'
        run: |
          docker image ls \
            --filter "reference=$ECR_REGISTRY/*"
